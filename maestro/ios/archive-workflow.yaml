appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- scrollUntilVisible:
    element: "Load Maestro fixture"
    direction: DOWN
- tapOn: "Load Maestro fixture"
- extendedWaitUntil:
    visible: "ZIP - 5 entries"
    timeout: 15000
- assertVisible: "Imported maestro-files.zip"
- assertVisible: "readme.txt"
- assertVisible: "manifest.json"
- assertVisible: "cover.svg"
- assertVisible: "release-notes.md"
- scrollUntilVisible:
    element: "summary.pdf"
    direction: DOWN
- assertVisible: "summary.pdf"
- tapOn: "Select Visible"
- scrollUntilVisible:
    element: "5 selected"
    direction: UP
- assertVisible: "5 selected"
- scrollUntilVisible:
    element: "Test"
    direction: UP
- tapOn: "Test"
- extendedWaitUntil:
    visible: "Archive verified"
    timeout: 15000
