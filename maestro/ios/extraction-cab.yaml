appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Load CAB fixture"
    direction: DOWN
- tapOn: "Load CAB fixture"
- extendedWaitUntil:
    visible: "CAB - 5 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 5 files saved to App storage.*"
    timeout: 30000
