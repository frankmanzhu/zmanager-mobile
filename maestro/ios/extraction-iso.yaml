appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- scrollUntilVisible:
    element: "Load ISO fixture"
    direction: DOWN
- tapOn:
    id: "debugLoadIso"
- scrollUntilVisible:
    element: "ISO - 8 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ISO - 8 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
    centerElement: true
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 8 files saved to App storage.*"
    timeout: 60000
