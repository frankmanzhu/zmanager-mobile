appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Load DEB fixture"
    direction: DOWN
- tapOn: "Load DEB fixture"
- extendedWaitUntil:
    visible: "Archive - 3 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 30000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
    centerElement: true
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 3 files saved to App storage.*"
    timeout: 60000
