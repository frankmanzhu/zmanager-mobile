appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Load encrypted fixture"
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- tapOn: "maestro-inner.zip"
- tapOn: "Create archive from selection"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Archive password"
    timeout: 15000
- tapOn: "Archive password"
- inputText: "wrong-password"
- tapOn: "Retry"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Archive password"
    timeout: 15000
- tapOn: "Archive password"
- eraseText: 100
- inputText: "v2testpassword"
- tapOn: "Retry"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Verified"
    timeout: 30000
