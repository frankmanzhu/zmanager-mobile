appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Load nested fixture"
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- assertVisible: "Start extraction"
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: "Extraction complete: .* files saved to App storage."
    timeout: 30000
