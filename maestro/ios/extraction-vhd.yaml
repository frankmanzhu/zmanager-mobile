appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- scrollUntilVisible:
    element: "Load VHD fixture"
    direction: DOWN
- tapOn:
    id: "debugLoadVhd"
- scrollUntilVisible:
    element: "VHD - 10 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "VHD - 10 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
    centerElement: true
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 10 files saved to App storage.*"
    timeout: 60000
