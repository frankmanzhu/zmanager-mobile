appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- tapOn: "Load test fixture"
- tapOn: "Split 7z fixture"
- extendedWaitUntil:
    visible: "7z - 6 entries"
    timeout: 15000
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 6 files saved to App storage.*"
    timeout: 30000
