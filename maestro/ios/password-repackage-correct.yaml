appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- tapOn: "Load encrypted fixture"
- scrollUntilVisible:
    element: "ZIP - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- scrollUntilVisible:
    element: "maestro-inner.zip"
    direction: DOWN
- tapOn: "maestro-inner.zip"
- tapOn: "Create archive from selection"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Start"
    direction: DOWN
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Archive password"
    timeout: 15000
- tapOn: "Archive password"
- eraseText: 100
- inputText: "v"
- inputText: "2"
- inputText: "t"
- inputText: "e"
- inputText: "s"
- inputText: "t"
- inputText: "p"
- inputText: "a"
- inputText: "s"
- inputText: "s"
- inputText: "w"
- inputText: "o"
- inputText: "r"
- inputText: "d"
- tapOn: "Retry"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Start"
    direction: DOWN
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Verified"
    timeout: 30000
- assertVisible: "Share output"
