appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Create debug folder archive"
- extendedWaitUntil:
    visible: "Start creation"
    timeout: 15000
- tapOn: "Start creation"
- extendedWaitUntil:
    visible: "Verified"
    timeout: 30000
- tapOn: "Load nested fixture"
- scrollUntilVisible:
    element: "ZIP - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- tapOn: "maestro-inner.zip"
- scrollUntilVisible:
    element: "Create archive from selection"
    direction: DOWN
- tapOn: "Create archive from selection"
- scrollUntilVisible:
    element: ".*Ready to repackage.*"
    direction: DOWN
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Start"
    direction: DOWN
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Verified"
    timeout: 30000
