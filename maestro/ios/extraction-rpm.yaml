appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn:
    id: "debugLoadRpmTop"
- scrollUntilVisible:
    element: "RPM - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "RPM - 1 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
    centerElement: true
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 1 files saved to App storage.*"
    timeout: 60000
