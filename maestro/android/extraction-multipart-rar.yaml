appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Load test fixture"
    direction: DOWN
- tapOn: "Load test fixture"
- scrollUntilVisible:
    element: "Multipart RAR fixture"
    direction: DOWN
- tapOn: "Multipart RAR fixture"
- extendedWaitUntil:
    visible: "Multipart RAR - 6 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 30000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 6 files saved to App storage.*"
    timeout: 60000
