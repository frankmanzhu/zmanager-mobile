appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Load nested fixture"
- scrollUntilVisible:
    element: "ZIP - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- assertVisible: "maestro-inner.zip"
- tapOn: "Open"
- scrollUntilVisible:
    element: "ZIP - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- assertVisible: "readme.txt"
- scrollUntilVisible:
    element: "Back"
    direction: UP
- tapOn: "Back"
- scrollUntilVisible:
    element: "maestro-inner.zip"
    direction: DOWN
- assertVisible: "maestro-inner.zip"
