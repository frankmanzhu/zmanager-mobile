appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Create debug folder archive"
- scrollUntilVisible:
    element: "Start"
    direction: DOWN
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Created .*"
    timeout: 30000
- assertVisible: "Verified"
- assertVisible: "Share output"
