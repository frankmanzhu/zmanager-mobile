appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- scrollUntilVisible:
    element: "Run timed-out extraction"
    direction: DOWN
- tapOn: "Run timed-out extraction"
- scrollUntilVisible:
    element: "Review extraction"
    direction: DOWN
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- tapOn: "Start extraction"
- scrollUntilVisible:
    element: "The archive job exceeded the Android background time limit. Retry it in the app."
    direction: DOWN
- extendedWaitUntil:
    visible: "The archive job exceeded the Android background time limit. Retry it in the app."
    timeout: 20000
