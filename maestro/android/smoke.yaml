appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- assertVisible: "Open an archive, inspect its contents, then extract safely."
- scrollUntilVisible:
    element: "Load Maestro fixture"
    direction: DOWN
- tapOn: "Load Maestro fixture"
- extendedWaitUntil:
    visible: "ZIP - 5 entries"
    timeout: 15000
