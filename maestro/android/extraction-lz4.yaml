appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- scrollUntilVisible:
    element: "Load test fixture"
    direction: DOWN
- tapOn: "Load test fixture"
- scrollUntilVisible:
    element: "LZ4 stream fixture"
    direction: DOWN
- tapOn: "LZ4 stream fixture"
- extendedWaitUntil:
    visible: "Raw stream - 1 entries"
    timeout: 30000
- scrollUntilVisible:
    element: "Extract"
    direction: DOWN
- tapOn: "Extract"
- extendedWaitUntil:
    visible: "Review extraction"
    timeout: 15000
- scrollUntilVisible:
    element: "Start extraction"
    direction: DOWN
- tapOn: "Start extraction"
- extendedWaitUntil:
    visible: ".*Extraction complete: 1 files saved to App storage.*"
    timeout: 30000
