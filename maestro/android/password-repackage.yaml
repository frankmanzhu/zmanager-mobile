appId: org.tzap.zmanager.mobile

---

- launchApp:
    clearState: true
- assertVisible: "ZManager"
- tapOn: "Load encrypted fixture"
- scrollUntilVisible:
    element: "ZIP - 1 entries"
    direction: DOWN
- extendedWaitUntil:
    visible: "ZIP - 1 entries"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 25%
    duration: 500
- tapOn: "Select maestro-inner.zip"
- tapOn: "Create archive from selection"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Archive password"
    timeout: 15000
- tapOn: "Archive password"
- inputText: "wrong-password"
- pressKey: BACK
- tapOn: "Retry"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Archive password"
    timeout: 15000
- tapOn: "Archive password"
- eraseText: 100
- inputText: "v2testpassword"
- pressKey: BACK
- tapOn: "Retry"
- extendedWaitUntil:
    visible: ".*Ready to repackage.*"
    timeout: 15000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Verified"
    timeout: 30000
- assertVisible: "Share output"
